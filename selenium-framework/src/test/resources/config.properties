# =====================================================
# Framework Configuration
# Override any of these from Maven CLI, e.g.:
# mvn test -Dbrowser=firefox -Dheadless=true
# =====================================================

# Application under test
baseUrl=https://ai-testcase-generator-nu.vercel.app/

# Test credentials (demo creds provided for this app)
username=admin
password=Admin@12345

# Browser: chrome | firefox | edge
browser=chrome

# Run headless (true for CI pipelines, false to watch it run locally)
headless=false

# Timeouts (seconds)
implicitWait=5
explicitWait=15
pageLoadTimeout=30

# Test data for "New Project" flow
project.name=kilo
project.description=hello
project.status=Planning

# Screenshot directory (relative to project root)
screenshotDir=test-output/screenshots

# ExtentReport output path
reportPath=test-output/ExtentReport.html

# Excel (.xlsx) test-result workbook output path
excelReportPath=test-output/Test_Results.xlsx

# Number of times a failed test is automatically retried before being
# marked FAILED for good. Set to 0 to disable retries entirely.
retryCount=2
